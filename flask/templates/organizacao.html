<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <title>{{ titulo }}</title>
    <style>
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
}

td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}

tr:nth-child(even) {
  background-color: #dddddd;
}
</style>
  </head>
  <body>
    <center><img src="{{ url_for('static', filename='cabecalho.png')}}" width="100" height="150" alt=""></center>
    <center><b>Ministério da Educação<br>
            Universidade Federal do Cariri<br>
            Plataforma Yoko - Eventos</b></center><br><hr>
    <center><p><b><h1>ORGANIZAÇÃO PARA AVALIADORES</b></h1></p></center>
    <h2>{{nome_edital}}</h2>
    <hr><br>

    <table style="width:100%">
      <caption><h2>SESSÕES ORAIS/POSTERS</h2></caption>
      <tr>
      <th>LISTA DE SESSÕES</th>
      </tr>
      {% for dia,sala in linhas %}
          
        <tr>
          <td><a href="/cppgi/apresentacoes?edital={{edital}}&data={{dia}}&sala={{sala}}">{{dia}} - {{sala}}</a></td>
        </tr>
          
      {% endfor %}
    </table>
    <hr>
  </body>
</html>
