{% extends "layout.html" %}

{% block title %}{{ titulo }}{% endblock %}

{% block page_header %}
<h1 class="page-title">ORGANIZAÇÃO PARA AVALIADORES</h1>
<h2 class="page-subtitle">{{nome_edital}}</h2>
{% endblock %}

{% block content %}
<div class="table-wrapper">
  <table class="table-base">
    <caption class="mb-2 text-left text-lg font-semibold text-slate-800">SESSÕES ORAIS/POSTERS</caption>
    <thead>
      <tr><th>LISTA DE SESSÕES</th></tr>
    </thead>
    <tbody>
      {% for dia,sala in linhas %}
        <tr>
          <td><a class="text-brand-700 hover:underline" href="/cppgi/apresentacoes?edital={{edital}}&data={{dia}}&sala={{sala}}">{{dia}} - {{sala}}</a></td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
