{% extends "layout.html" %}

{% block title %}Esqueci minha senha{% endblock %}

{% block head_extra %}
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<script>
function humano() {
  if (grecaptcha.getResponse() == "") {
    alert("Marque a caixa abaixo para continuar...");
    return (false);
  }
  return (true);
}
</script>
{% endblock %}

{% block content %}
<h2 class="page-title text-center">Esqueci minha senha</h2>

<div class="mx-auto mt-4 max-w-md card">
  <form action="/cppgi/enviarMinhaSenha" method="POST" onsubmit="return humano()" class="flex flex-col gap-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

    <div class="alert-success">
      <h2 class="text-lg font-bold">Recuperação de senha</h2>
    </div>

    <div>
      <label class="form-label" for="email">E-Mail do autor principal (quem fez a submissão)</label>
      <input class="form-input" type="text" id="email" placeholder="e-mail: " name="email" required>
    </div>

    {% if session['PRODUCAO']==1 %}
      <div class="flex justify-center">
        <div class="g-recaptcha" data-sitekey="6LcTP7IrAAAAAEGXU_wjThN5GsBZ3mZCy67tzQyH"></div>
      </div>
    {% endif %}

    <button class="btn-primary" type="submit">Recuperar Senha</button>
  </form>
</div>
{% endblock %}
