{% extends "layout.html" %}

{% block title %}Esqueci minha senha{% endblock %}

{% block head_extra %}
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script>
//Só melhora a experiência: a validação que vale é a do servidor (turnstile_valido)
function humano() {
  var token = document.querySelector('[name="cf-turnstile-response"]');
  if (!token || token.value == "") {
    alert("Aguarde a verificação de segurança abaixo (ou marque a caixa) para continuar...");
    return (false);
  }
  return (true);
}
</script>
{% endblock %}

{% block content %}
<h2 class="page-title text-center">Esqueci minha senha</h2>

<div class="mx-auto mt-4 max-w-md card">
  <form action="/cppgi/enviarMinhaSenha" method="POST" onsubmit="return humano()" class="flex flex-col gap-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

    <div class="alert-success">
      <h2 class="text-lg font-bold">Recuperação de senha</h2>
    </div>

    <div>
      <label class="form-label" for="email">E-Mail do autor principal (quem fez a submissão)</label>
      <input class="form-input" type="text" id="email" placeholder="e-mail: " name="email" required>
    </div>

    <div class="flex justify-center">
      <div class="cf-turnstile" data-sitekey="{{ TURNSTILE_KEY }}" data-language="pt-br"></div>
    </div>

    <button class="btn-primary" type="submit">Recuperar Senha</button>
  </form>
</div>
{% endblock %}
