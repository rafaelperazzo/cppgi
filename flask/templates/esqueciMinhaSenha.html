<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<style>
body {font-family: Arial, Helvetica, sans-serif;}
form {border: 3px solid #f1f1f1;}

input[type=text], input[type=password] {
  width: 100%;
  padding: 12px 20px;
  margin: 8px 0;
  display: inline-block;
  border: 1px solid #ccc;
  box-sizing: border-box;
}

button {
  background-color: #4CAF50;
  color: white;
  padding: 14px 20px;
  margin: 8px 0;
  border: none;
  cursor: pointer;
  width: 100%;
}

button:hover {
  opacity: 0.8;
}

.cancelbtn {
  width: auto;
  padding: 10px 18px;
  background-color: #f44336;
}

.imgcontainer {
  text-align: center;
  margin: 24px 0 12px 0;
}

img.avatar {
  width: 40%;
  border-radius: 50%;
}

.container {
  padding: 16px;
}

span.psw {
  float: right;
  padding-top: 16px;
}

/* Change styles for span and cancel button on extra small screens */
@media screen and (max-width: 300px) {
  span.psw {
     display: block;
     float: none;
  }
  .cancelbtn {
     width: 100%;
  }
}
</style>
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.1.3/css/bootstrap.min.css">
<script>
function humano() {
   if (grecaptcha.getResponse() == ""){
    alert("Marque a caixa abaixo para continuar...");
    return (false);
   } else {
          //alert("Thank you");
    return (true);
     }
}
</script>

</head>
<body>

<h2>Esqueci minha senha</h2>

<form action="/cppgi/enviarMinhaSenha" METHOD="POST" onsubmit="return humano()">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
  <div class="container-sm">
    <div class="alert alert-success" role="alert">
      <center><h2>Recuperação de senha</h2></center>
    </div>
    <label for="uname"><b>E-Mail do autor principal (quem fez a submissão)</b></label>
    <input class="form-control" type="text" placeholder="e-mail: " name="email" required>
     {%if session['PRODUCAO']==1%}
        <center><div class="g-recaptcha" data-sitekey="6Lfe8NgbAAAAAPYO9OZF4i34EpSKvNGQihaxr0Am"></div></center>
     {%endif%}
    <button class="btn btn-primary" type="submit">Recuperar Senha</button>
  </div>

</form>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.bundle.min.js" integrity="sha384-pprn3073KE6tl6bjs2QrFaJGz5/SUsLqktiwsUTF55Jfv3qYSDhgCecCxMW52nD2" crossorigin="anonymous"></script>
</body>
</html>
