{% extends "layout.html" %}

{% block title %}Cadastre-se{% endblock %}

{% block head_extra %}
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script>
//Só melhora a experiência: a validação que vale é a do servidor (turnstile_valido)
function humano() {
  var token = document.querySelector('[name="cf-turnstile-response"]');
  if (!token || token.value == "") {
    alert("Aguarde a verificação de segurança abaixo (ou marque a caixa) para continuar...");
    return (false);
  }
  return (true);
}
</script>
{% endblock %}

{% block content %}
<h2 class="page-title text-center">Cadastre-se</h2>

<div class="mx-auto mt-4 max-w-md card">
  <form action="{{ url_for('cadastro') }}" method="POST" onsubmit="return humano()" class="flex flex-col gap-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

    {% if mensagem %}
    <div class="alert-warning">
      <p>{{ mensagem }}</p>
    </div>
    {% endif %}

    <div>
      <label class="form-label" for="cpf">CPF (apenas os números, sem pontos ou espaços)</label>
      <input class="form-input" type="text" id="cpf" placeholder="Ex: 00000000000" name="cpf" required>
    </div>

    <div>
      <label class="form-label" for="nome">Nome completo</label>
      <input class="form-input" type="text" id="nome" name="nome" required>
    </div>

    <div>
      <label class="form-label" for="email">E-mail</label>
      <input class="form-input" type="email" id="email" name="email" required>
    </div>

    <div>
      <label class="form-label" for="senha">Senha (mínimo 12 caracteres, com maiúscula, minúscula, número e caractere especial)</label>
      <input class="form-input" type="password" id="senha" name="senha" required minlength="12">
    </div>

    <div class="flex justify-center">
      <div class="cf-turnstile" data-sitekey="{{ TURNSTILE_KEY }}" data-language="pt-br"></div>
    </div>

    <button class="btn-primary" type="submit">Cadastrar</button>
    <a class="text-center text-sm text-brand-700 hover:underline" href="{{ url_for('login') }}">Já tenho conta</a>
    <a class="text-center text-sm text-brand-700 hover:underline" href="{{ url_for('esqueciMinhaSenha') }}">Esqueci/Não Sei minha Senha</a>
  </form>
</div>
{% endblock %}
