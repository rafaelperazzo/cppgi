<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inserir Avaliador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-0evHe/X+R7YkIZDRvuzKMRqM+OrBnVFBL6DOitfPri4tjfHxaWutUpFmBp4vmVor" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script>
      $(document).ready(function(){
        $("#avaliador_sugerido").on("change", function(event){  
          var sugerido = $('#avaliador_sugerido').val();
          if (sugerido=="0") {
            $('#email_avaliador').show();
          }
          else {
            $('#email_avaliador').hide();
          }
        });
      });
      
    </script>
  </head>
  <body>
    <form name="frmEnviar" action="/cppgi/inserirAvaliador" method="POST">
      <div class="container text-center">
        <div class="row align-items-center justify-content-start">
          <div class="col">
            <b>Projeto</b>:
            <select class="form-select form-select-lg mb-3" name="txtProjeto" required="required">
              {% for linha in listaProjetos %}
              <option value="{{ linha[0] }}">(Id: {{ linha[0] }}) - {{ linha[1] }}</option>
              {% endfor %}
            </select>
          </div>
        </div>
        <div class="row align-items-center justify-content-start">
          <div class="col" id="email_avaliador">
            <b>E-mail do avaliador</b>: <input class="form-control form-control-sm" name="txtEmail" id="txtEmail" required="required" size="80" type="text">
          </div>
          <div class="col">
            <b>Escolher um avaliador sugerido</b>:
            <select class="form-select form-select-lg mb-3" name="avaliador_sugerido" id="avaliador_sugerido">
              <option value="0" selected="selected">N/A</option>
              {%for avaliador in avaliadores %}
                <option value="{{avaliador[0]}}">{{avaliador[1]}}</option>
              {% endfor %}
            </select>
          </div>
        </div>
        <div class="row align-items-center justify-content-start">
          <div class="col-md-6 offset-md-3">
            <input class="btn btn-primary btn-lg" name="btnEnviar" value="Enviar" type="submit">
          </div>
        </div>
        <div class="row align-items-center justify-content-start">
          <div class="col-md-6 offset-md-3">
            <p></p>
            <a href="{{url_for('listar_consultores',id_projeto=listaProjetos[0][0])}}"><button type="button" class="btn btn-outline-primary">Voltar para lista de avaliadores</button></a>
          </div>
        </div>
      </div>

    </form>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.bundle.min.js" integrity="sha384-pprn3073KE6tl6bjs2QrFaJGz5/SUsLqktiwsUTF55Jfv3qYSDhgCecCxMW52nD2" crossorigin="anonymous"></script>
  </body>
</html>
