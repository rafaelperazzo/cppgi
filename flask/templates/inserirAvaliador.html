<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inserir Avaliador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-0evHe/X+R7YkIZDRvuzKMRqM+OrBnVFBL6DOitfPri4tjfHxaWutUpFmBp4vmVor" crossorigin="anonymous">
  </head>
  <body>
    <form name="frmEnviar" action="/cppgi/inserirAvaliador" method="POST"><br>
      <b>Projeto</b>:
      <select name="txtProjeto" required="required">
        {% for linha in listaProjetos %}
        <option value="{{ linha[0] }}">(Id: {{ linha[0] }}) - {{ linha[1] }}</option>
        {% endfor %}
      </select>
      <br>
      <b>E-mail do avaliador</b>: <input name="txtEmail" required="required" size="80"
        type="text"><br>
      <div style="text-align: left;"><input name="btnEnviar" value="Enviar" type="submit"><br>
      </div>
      <br>

    </form>
    <p><br>
    </p>
    <a href="/cppgi/editalProjeto?edital={{codigoEdital}}"> VOLTAR PARA LISTA DE PROJETOS</a>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.bundle.min.js" integrity="sha384-pprn3073KE6tl6bjs2QrFaJGz5/SUsLqktiwsUTF55Jfv3qYSDhgCecCxMW52nD2" crossorigin="anonymous"></script>
  </body>
</html>
