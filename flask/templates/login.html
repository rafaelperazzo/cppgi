{% extends "layout.html" %}

{% block title %}Autenticação{% endblock %}

{% block head_extra %}
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<script>
function humano() {
  if (grecaptcha.getResponse() == "") {
    alert("Marque a caixa abaixo para continuar...");
    return (false);
  }
  return (true);
}
</script>
{% endblock %}

{% block content %}
<div class="mx-auto max-w-md card">
  <form action="{{ url_for('login') }}" method="POST" onsubmit="return humano()" class="flex flex-col gap-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

    <div class="alert-success">
      <div>
        <h2 class="text-lg font-bold">Autenticação</h2>
        <p>{{ mensagem }}</p>
      </div>
    </div>

    <div>
      <label class="form-label" for="siape">Usuário (CPF - sem pontos, espaços ou travessão)</label>
      <input class="form-input" type="text" id="siape" placeholder="CPF: " name="siape" required>
    </div>

    <div>
      <label class="form-label" for="psw">Senha</label>
      <input class="form-input" type="password" id="psw" placeholder="Senha" name="senha" required>
    </div>

    {% if session['PRODUCAO']==1 %}
      <div class="flex justify-center">
        <div class="g-recaptcha" data-sitekey="6LcTP7IrAAAAAEGXU_wjThN5GsBZ3mZCy67tzQyH"></div>
      </div>
    {% endif %}

    <button class="btn-primary" type="submit">Entrar</button>
    <a class="text-center text-sm text-brand-700 hover:underline" href="{{ url_for('esqueciMinhaSenha') }}">Esqueci/Não Sei minha Senha</a>
  </form>
</div>
{% endblock %}
