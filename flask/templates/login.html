{% extends "layout.html" %}

{% block title %}Autenticação{% endblock %}

{% block head_extra %}
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script>
//Só melhora a experiência: a validação que vale é a do servidor (turnstile_valido)
function humano() {
  var token = document.querySelector('[name="cf-turnstile-response"]');
  if (!token || token.value == "") {
    alert("Aguarde a verificação de segurança abaixo (ou marque a caixa) para continuar...");
    return (false);
  }
  return (true);
}
</script>
{% endblock %}

{% block content %}
<div class="mx-auto max-w-md card">
  <form action="{{ url_for('login') }}" method="POST" onsubmit="return humano()" class="flex flex-col gap-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
    <input type="hidden" name="next" value="{{ next or '' }}"/>

    <div class="alert-success">
      <div>
        <h2 class="text-lg font-bold">Autenticação</h2>
        <p>{{ mensagem }}</p>
      </div>
    </div>

    <div>
      <label class="form-label" for="siape">Usuário (CPF - sem pontos, espaços ou travessão)</label>
      <input class="form-input" type="text" id="siape" placeholder="CPF: " name="siape" required>
    </div>

    <div>
      <label class="form-label" for="psw">Senha</label>
      <input class="form-input" type="password" id="psw" placeholder="Senha" name="senha" required>
    </div>

    <div class="flex justify-center">
      <div class="cf-turnstile" data-sitekey="{{ TURNSTILE_KEY }}" data-language="pt-br"></div>
    </div>

    <button class="btn-primary" type="submit">Entrar</button>
    <a class="text-center text-sm text-brand-700 hover:underline" href="{{ url_for('esqueciMinhaSenha') }}">Esqueci/Não Sei minha Senha</a>
  </form>

  <hr class="my-4 border-slate-200">

  <p class="text-center text-sm text-slate-600">
    Ainda não tem cadastro?
    <a class="font-semibold text-brand-700 hover:underline" href="{{ url_for('cadastro') }}">Criar conta</a>
  </p>
</div>
{% endblock %}
