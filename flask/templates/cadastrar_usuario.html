<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ titulo }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-0evHe/X+R7YkIZDRvuzKMRqM+OrBnVFBL6DOitfPri4tjfHxaWutUpFmBp4vmVor" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script>

    function validarCPF(cpf) {	
        cpf = cpf.replace(/[^\d]+/g,'');	
        if(cpf == '') return false;	
        // Elimina CPFs invalidos conhecidos	
        if (cpf.length != 11 || 
            cpf == "00000000000" || 
            cpf == "11111111111" || 
            cpf == "22222222222" || 
            cpf == "33333333333" || 
            cpf == "44444444444" || 
            cpf == "55555555555" || 
            cpf == "66666666666" || 
            cpf == "77777777777" || 
            cpf == "88888888888" || 
            cpf == "99999999999")
                return false;		
        // Valida 1o digito	
        add = 0;	
        for (i=0; i < 9; i ++)		
            add += parseInt(cpf.charAt(i)) * (10 - i);	
            rev = 11 - (add % 11);	
            if (rev == 10 || rev == 11)		
                rev = 0;	
            if (rev != parseInt(cpf.charAt(9)))		
                return false;		
        // Valida 2o digito	
        add = 0;	
        for (i = 0; i < 10; i ++)		
            add += parseInt(cpf.charAt(i)) * (11 - i);	
        rev = 11 - (add % 11);	
        if (rev == 10 || rev == 11)	
            rev = 0;	
        if (rev != parseInt(cpf.charAt(10)))
            return false;		
        return true;   
    }
    </script>
    <script>
        $(document).ready(function(){
            $('#btnSalvar').on('click',function(event){
                console.log("Clicou!");
                var username = $('#username').val(); 
                if (validarCPF(username)) {
                    $('#form_cadastrar_usuario').submit();
                }
                else {
                    alert('CPF inválido!');
                }
            });
        });
    </script>
    </head>
  <body>
    <center><img src="{{ url_for('static', filename='cabecalho.png')}}" width="100" height="150" alt=""></center>
    <center><b>Ministério da Educação<br>
            Universidade Federal do Cariri<br>
            Plataforma Yoko - Eventos</b></center><br><hr>
    <center><p><b><h1>MÓDULO ADMIN</b></h1></p></center>
    <hr>
    <center><p><b><h1>CADASTRAR USUÁRIO</b></h1></p></center>
    <a href="{{url_for('root')}}"><button type="button" class="btn btn-outline-primary">Voltar</button></a> 
    <form name="form_cadastrar_usuario" id="form_cadastrar_usuario" action="{{url_for('cadastrar_usuario',operacao=0)}}" method="POST">
        
        <div class="container text-center">
            <div class="row align-items-start">
                <div class="alert alert-dark" role="alert">
                    <H3>Dados gerais</H3>
                </div>
                <div class="col">
                    <p><b>CPF</b></p>
                    <input class="form-control-sm" type="text" id="username" name="username" required="required">
                </div>
                <div class="col">
                    <p><b>Senha</b></p>
                    <input class="form-control-sm" type="password" id="password" name="password" required="required">
                </div>
                <div class="col">
                    <p><b>Permissão</b></p>
                    <select class="form-select" id="permission" name="permission" required="required">
                        <option value="1">Usuário comum</option>
                        <option value="0">Admin</option>
                    </select>
                </div>
                <div class="col">
                    <p><b>Papeis</b></p>
                    <select class="form-select" id="roles" name="roles" required="required">
                        <option value="user">Usuário</option>
                        <option value="user,avaliador">Usuário e avaliador</option>
                        <option value="user,avaliador,admin">Usuário, avaliador e admin</option>
                        <option value="avaliador">Avaliador</option>
                        <option value="monitor">Monitor de sessão</option>
                    </select>
                </div>
            </div>
        </div>
        
        <div class="container text-center">
            <div class="alert alert-dark" role="alert">
                <H3>Dados de contato</H3>
            </div>
            <div class="row align-items-start">
                <div class="col">
                    <p><b>Nome</b></p>
                    <input class="form-contol" name="nome" id="nome" type="text" required="required">                                                  
                </div>
                <div class="col">
                    <p><b>E-mail</b></p>
                    <input type="email" class="form-control form-control-sm" id="email" name="email" required="required">                                
                </div>
            </div>
        </div>
        
        <center><input class="btn btn-success" type="button" value="Salvar" id="btnSalvar" name="btnSalvar"></center>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.bundle.min.js" integrity="sha384-pprn3073KE6tl6bjs2QrFaJGz5/SUsLqktiwsUTF55Jfv3qYSDhgCecCxMW52nD2" crossorigin="anonymous"></script>
  </body>
</html>
