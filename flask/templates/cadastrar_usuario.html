{% extends "layout.html" %}

{% block title %}{{ titulo }}{% endblock %}

{% block head_extra %}
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script>

function validarCPF(cpf) {
    cpf = cpf.replace(/[^\d]+/g,'');
    if(cpf == '') return false;
    // Elimina CPFs invalidos conhecidos
    if (cpf.length != 11 ||
        cpf == "00000000000" ||
        cpf == "11111111111" ||
        cpf == "22222222222" ||
        cpf == "33333333333" ||
        cpf == "44444444444" ||
        cpf == "55555555555" ||
        cpf == "66666666666" ||
        cpf == "77777777777" ||
        cpf == "88888888888" ||
        cpf == "99999999999")
            return false;
    // Valida 1o digito
    add = 0;
    for (i=0; i < 9; i ++)
        add += parseInt(cpf.charAt(i)) * (10 - i);
        rev = 11 - (add % 11);
        if (rev == 10 || rev == 11)
            rev = 0;
        if (rev != parseInt(cpf.charAt(9)))
            return false;
    // Valida 2o digito
    add = 0;
    for (i = 0; i < 10; i ++)
        add += parseInt(cpf.charAt(i)) * (11 - i);
    rev = 11 - (add % 11);
    if (rev == 10 || rev == 11)
        rev = 0;
    if (rev != parseInt(cpf.charAt(10)))
        return false;
    return true;
}
</script>

{% block page_header %}
<h1 class="page-title">MÓDULO ADMIN</h1>
<h2 class="page-subtitle">CADASTRAR USUÁRIO</h2>

{% block content %}
<a href="{{url_for('root')}}" class="btn-outline mb-4 inline-block">Voltar</a>

<form name="form_cadastrar_usuario" id="form_cadastrar_usuario" action="{{url_for('cadastrar_usuario',operacao=0)}}" method="POST" class="flex flex-col gap-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

    <div class="alert-info"><h3 class="text-lg font-bold">Dados gerais</h3></div>
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
        <div>
            <label class="form-label">CPF</label>
            <input class="form-input" type="text" id="username" name="username" required="required">
        </div>
        <div>
            <label class="form-label">Senha</label>
            <input class="form-input" type="password" id="password" name="password" required="required">
        </div>
        <div>
            <label class="form-label">Permissão</label>
            <select class="form-select" id="permission" name="permission" required="required">
                <option value="1">Usuário comum</option>
                <option value="0">Admin</option>
            </select>
        </div>
        <div>
            <label class="form-label">Papeis</label>
            <select class="form-select" id="roles" name="roles" required="required">
                <option value="user">Usuário</option>
                <option value="user,avaliador">Usuário e avaliador</option>
                <option value="user,avaliador,admin">Usuário, avaliador e admin</option>
                <option value="avaliador">Avaliador</option>
                <option value="monitor">Monitor de sessão</option>
            </select>
        </div>
    </div>

    <div class="alert-info"><h3 class="text-lg font-bold">Dados de contato</h3></div>
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div>
            <label class="form-label">Nome</label>
            <input class="form-input" name="nome" id="nome" type="text" required="required">
        </div>
        <div>
            <label class="form-label">E-mail</label>
            <input type="email" class="form-input" id="email" name="email" required="required">
        </div>
    </div>

    <div class="flex justify-center">
        <input class="btn-primary cursor-pointer" type="button" value="Salvar" id="btnSalvar" name="btnSalvar">
    </div>
</form>
{% endblock %}
