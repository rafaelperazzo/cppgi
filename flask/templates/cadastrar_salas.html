{% extends "layout.html" %}

{% block title %}{{ titulo }}{% endblock %}

{% block page_header %}
<h1 class="page-title">MÓDULO ADMIN</h1>
<h2 class="page-subtitle">CADASTRAR SESSÃO</h2>
{% endblock %}

{% block content %}
<form name="form_cadastrar_salas" id="form_cadastrar_salas" action="{{url_for('cadastrar_salas',edital=edital)}}" method="POST" class="flex flex-col gap-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

    <div class="alert-info">
        <div>
          <h3 class="text-lg font-bold">DATA/SESSÃO</h3>
          <p class="mt-1 text-sm">Ex: Dia <b>14/04/2022</b>, das <b>14:00</b> as <b>17:00</b> com slots de <b>10</b> minutos, nas salas <b>K01,K06,I101</b></p>
        </div>
    </div>

    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
        <div>
            <label class="form-label">Dia</label>
            <input class="form-input" type="date" id="dia" name="dia" required="required">
        </div>
        <div>
            <label class="form-label">Início</label>
            <input class="form-input" type="time" id="inicio" name="inicio" required="required">
        </div>
        <div>
            <label class="form-label">Fim</label>
            <input type="time" class="form-input" id="fim" name="fim" required="required">
        </div>
        <div>
            <label class="form-label">Tempo de cada Apresentação</label>
            <select class="form-select" id="slots" name="slots" required="required">
                <option value="5">5 minutos</option>
                <option value="10">10 minutos</option>
                <option value="15" selected="selected">15 minutos</option>
                <option value="20">20 minutos</option>
                <option value="25">25 minutos</option>
                <option value="30">30 minutos</option>
                <option value="35">35 minutos</option>
                <option value="40">40 minutos</option>
            </select>
        </div>
    </div>

    <div class="alert-info"><h3 class="text-lg font-bold">SALAS</h3></div>
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div>
            <label class="form-label">Tipo de sessão</label>
            <select class="form-select" id="tipo" name="tipo" required="required">
                <option value="0">Apresentação Oral</option>
                <option value="1">Poster</option>
            </select>
        </div>
        <div>
            <label class="form-label">Lista de salas (Separadas por virgula. Ex: S1,S2,S3)</label>
            <input type="text" class="form-input" id="salas" name="salas" placeholder="Ex: K06,A02,I101" required="required">
        </div>
    </div>

    <div class="flex justify-center">
        <input class="btn-primary cursor-pointer" type="submit" value="Salvar">
    </div>
</form>
{% endblock %}
