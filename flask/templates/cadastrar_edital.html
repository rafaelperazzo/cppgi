{% extends "layout.html" %}

{% block title %}{{ titulo }}{% endblock %}

{% block page_header %}
<h1 class="page-title">MÓDULO ADMIN</h1>
<h2 class="page-subtitle">CADASTRAR EDITAL</h2>
{% endblock %}

{% block content %}
<form action="{{url_for('cadastrar_edital')}}" method="POST" enctype="multipart/form-data" class="flex flex-col gap-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

    <div class="alert-info"><h3 class="text-lg font-bold">DESCRIÇÃO DO EDITAL</h3></div>
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div>
            <label class="form-label">Nome curto</label>
            <input type="text" class="form-input" id="nome_curto" name="nome_curto" placeholder="NOME CURTO DO EDITAL" required="required">
        </div>
        <div>
            <label class="form-label">Nome longo</label>
            <input type="text" class="form-input" id="nome" name="nome" placeholder="DESCRIÇÃO DO EDITAL" required="required">
        </div>
    </div>

    <div class="alert-info"><h3 class="text-lg font-bold">DATAS</h3></div>
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
        <div>
            <label class="form-label">Deadline submissões</label>
            <input class="form-input" type="date" id="deadline" name="deadline" required="required">
        </div>
        <div>
            <label class="form-label">Deadline de avaliações dos trabalhos</label>
            <input class="form-input" type="date" id="deadline_avaliacao" name="deadline_avaliacao" required="required">
        </div>
        <div>
            <label class="form-label">Deadline de submissão da versão final</label>
            <input type="date" class="form-input" id="deadline_final" name="deadline_final" required="required">
        </div>
        <div>
            <label class="form-label">Deadline de submissão da apresentação</label>
            <input type="date" class="form-input" id="deadline_apresentacao" name="deadline_apresentacao" required="required">
        </div>
    </div>

    <div class="alert-info"><h3 class="text-lg font-bold">SITUACAO DO EDITAL E ISBN</h3></div>
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div>
            <label class="form-label">Situação</label>
            <input type="text" class="form-input" id="situacao" name="situacao" placeholder="Situação" required="required" value="N/A">
        </div>
        <div>
            <label class="form-label">ISBN</label>
            <input type="text" class="form-input" id="isbn" name="isbn" placeholder="ISBN" required="required">
        </div>
    </div>

    <div class="flex justify-center">
        <input class="btn-primary cursor-pointer" type="submit" value="Salvar">
    </div>
</form>
{% endblock %}
